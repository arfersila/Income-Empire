<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Income Empire</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #10131a;
  color: white;
}

.app {
  max-width: 500px;
  margin: auto;
  padding: 20px;
}

h1 {
  text-align: center;
  margin-bottom: 25px;
}

.card {
  background: #1b202b;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 15px;
}

.balance {
  text-align: center;
  font-size: 36px;
  font-weight: bold;
  margin: 10px 0;
}

.income {
  text-align: center;
  color: #8ee28e;
  margin-bottom: 10px;
}

.pending {
  text-align: center;
  color: #ffd166;
  font-size: 18px;
  margin-bottom: 20px;
}

button {
  width: 100%;
  border: 0;
  border-radius: 14px;
  padding: 16px;
  font-size: 18px;
  font-weight: bold;
  background: #2ea6ff;
  color: white;
  cursor: pointer;
}

button:active {
  transform: scale(0.98);
}

button:disabled {
  opacity: 0.6;
}

.status {
  text-align: center;
  margin-top: 12px;
  font-size: 13px;
  color: #999;
}

.business {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
</style>
</head>

<body>

<div class="app">

  <h1>🏙️ Income Empire</h1>

  <div class="card">

    <div style="text-align:center;">
      💰 Balance
    </div>

    <div class="balance" id="balance">
      Loading...
    </div>

    <div class="income">
      +<span id="income">50</span> 🪙 / hour
    </div>

    <div class="pending">
      Накоплено: +<span id="pending">0</span> 🪙
    </div>

    <button id="collectButton">
      COLLECT +0 🪙
    </button>

    <div class="status" id="status">
      Connecting...
    </div>

  </div>


  <div class="card">

    <h2>🏪 Business</h2>

    <div class="business">

      <div>
        <b>Small Shop</b>
        <br>
        <span>+50 🪙 / hour</span>
      </div>

      <div>
        OWNED
      </div>

    </div>

  </div>

</div>


<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

const API =
  "https://old-haze-267f.demchukandriy2.workers.dev";

let telegramId = null;

let player = null;

let pendingCoins = 0;


const balanceElement =
  document.getElementById("balance");

const incomeElement =
  document.getElementById("income");

const pendingElement =
  document.getElementById("pending");

const collectButton =
  document.getElementById("collectButton");

const statusElement =
  document.getElementById("status");


if (
  tg.initDataUnsafe &&
  tg.initDataUnsafe.user
) {

  telegramId =
    String(tg.initDataUnsafe.user.id);

  loadPlayer();

} else {

  statusElement.textContent =
    "Открой игру через Telegram";

}


async function loadPlayer() {

  try {

    statusElement.textContent =
      "Loading...";

    const response =
      await fetch(
        API +
        "/player?telegram_id=" +
        encodeURIComponent(telegramId)
      );

    const data =
      await response.json();

    if (!data.success) {
      throw new Error(data.error);
    }

    player = data.player;

    balanceElement.textContent =
      Number(player.balance).toLocaleString();

    incomeElement.textContent =
      player.income_per_hour;

    statusElement.textContent =
      "Connected ✓";

    updatePending();

  } catch (error) {

    console.error(error);

    statusElement.textContent =
      "Connection error";

  }

}


function updatePending() {

  if (!player) return;

  const now = Date.now();

  const secondsPassed =
    Math.max(
      0,
      (now - player.last_seen) / 1000
    );

  pendingCoins =
    Math.floor(
      secondsPassed *
      player.income_per_hour /
      3600
    );

  pendingElement.textContent =
    pendingCoins.toLocaleString();

  collectButton.textContent =
    "COLLECT +" +
    pendingCoins.toLocaleString() +
    " 🪙";

}


setInterval(
  updatePending,
  1000
);


collectButton.addEventListener(
  "click",
  async function() {

    if (!telegramId) return;

    collectButton.disabled = true;

    try {

      statusElement.textContent =
        "Collecting...";

      const response =
        await fetch(
          API +
          "/collect?telegram_id=" +
          encodeURIComponent(telegramId)
        );

      const data =
        await response.json();

      if (!data.success) {
        throw new Error(data.error);
      }

      balanceElement.textContent =
        Number(data.balance).toLocaleString();

      pendingCoins = 0;

      pendingElement.textContent =
        "0";

      collectButton.textContent =
        "COLLECT +0 🪙";

      statusElement.textContent =
        "+" + data.earned + " 🪙 collected ✓";


      // Обновляем данные игрока

      await loadPlayer();

    } catch (error) {

      console.error(error);

      statusElement.textContent =
        "Error";

    }

    collectButton.disabled = false;

  }
);

</script>

</body>
</html>
</html>
